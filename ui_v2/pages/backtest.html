<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>量化研究 · 回测</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/v2/assets/ui_common.css">
<link rel="stylesheet" href="/v2/assets/anim_common.css">
<link rel="stylesheet" href="/v2/assets/app.css">
<link rel="stylesheet" href="/v2/assets/studio.css"><link rel="stylesheet" href="/v2/assets/backtest_report.css">
<style>
  .bt-ctl { display:flex; flex-wrap:wrap; gap:12px; margin:12px 0; align-items:end; }
  .bt-ctl label { font-size:12px; color:#a1a1aa; }
  .bt-ctl select, .bt-ctl input { margin-left:4px; padding:7px 8px; border:1px solid #3c506e; border-radius:6px; font-size:12px; outline:none; background:#182334; color:#e0e8f7; max-width:100%; box-sizing:border-box; }
  #bt-parameters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));align-items:stretch;gap:14px}
  .bt-param-group{border:1px solid #303e51;border-radius:8px;min-width:0;margin:0;padding:12px;display:flex;flex-wrap:wrap;align-content:start;gap:13px}
  .bt-param-group legend{font-size:13px;color:#c7d5eb;padding:0 6px}.bt-param-group label{display:flex;flex-direction:column;gap:6px;max-width:100%}.bt-param-group input,.bt-param-group select{margin-left:0}
  .bt-param-group label[hidden]{display:none}
  #bt-pool-note{grid-column:1/-1;font-size:12px;color:#aab4c1;line-height:1.8;margin:0}
  #bt-filter select,#bt-filter input{background:#182334;color:#e0e8f7;border:1px solid #3c506e}
  #bt-archive>div{grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))!important}
  .bt-ctl select:focus, .bt-ctl input:focus { border-color:var(--navy2); }
  .bt-kpi { display:flex; flex-wrap:wrap; gap:16px; margin:12px 0; }
  .bt-kpi .k { min-width:104px; }
  .bt-kpi .lb { font-size:11px; color:#a1a1aa; }
  .bt-kpi .vl { font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; }
  .bt-stat { width:100%; border-collapse:collapse; font-size:12px; }
  .bt-stat td { padding:7px 10px; border-bottom:1px solid rgba(255,255,255,.08); }
  .bt-stat td:first-child { color:#a1a1aa; }
  .bt-stat td:last-child { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .bt-legend { display:flex; gap:16px; font-size:12px; color:#a1a1aa; margin:6px 0; }
  .bt-legend .sw { display:inline-block; width:14px; height:3px; border-radius:2px; margin-right:5px; vertical-align:2px; }
  .vtag { font-size:11px; padding:2px 8px; border-radius:6px; font-weight:600; margin-left:6px; white-space:nowrap; }
  .vtag-yx  { background:rgba(34,197,94,.13);  color:#4ade80; }   /* 有效（旧）*/
  .vtag-wx  { background:rgba(239,68,68,.12);   color:#f87171; }   /* 无效 */
  .vtag-v5  { background:rgba(34,197,94,.15);   color:#4ade80; }   /* 优秀 */
  .vtag-v4  { background:rgba(20,184,166,.14);  color:#2dd4bf; }   /* 良好 */
  .vtag-v3  { background:rgba(234,179,8,.13);   color:#facc15; }   /* 观察 */
  .vtag-v2  { background:rgba(249,115,22,.13);  color:#fb923c; }   /* 勉强 */
  .vtag-v1  { background:rgba(239,68,68,.12);   color:#f87171; }   /* 无效 */
  /* 周期快捷按钮 */
  .bt-period-btns { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:6px; }
  .bt-period-btns button { font-size:11px; padding:3px 9px; border-radius:5px; border:1px solid #3c506e; background:#182334; color:#b0c4de; cursor:pointer; transition:background .15s,color .15s; }
  .bt-period-btns button:hover { background:#233047; color:#e0e8f7; }
  .bt-period-btns button.active { background:rgba(45,100,180,.25); border-color:#4a7fc1; color:#91b9ff; }
  .bt-filter { display:flex; flex-wrap:wrap; gap:8px; margin:10px 0; align-items:center; }
</style>
</head>
<body style="background:var(--bg);margin:0">
<div id="sidebar"></div>
<div class="v2-wrap">
  <div class="v2-h"><span class="bar"></span><h1>量化研究 · 回测</h1><span class="sub">选择策略 → 设置费用 → 运行回测 → 比较结果</span></div>

  <!-- 策略回测（参数 + 运行 + 结果） -->
  <div class="v2-card anim-fade-in-up d0" style="margin-top:14px">
    <h2> 策略回测 <span class="tag">T+1 开盘 · 按实际成交计费</span></h2>
    <div class="bt-ctl">
      <label>筛选
        <select id="bt-cat-filter" style="width:86px">
          <option value="">加载中…</option>
        </select>
      </label>
      <input id="bt-search" placeholder="搜索策略…" style="width:110px;padding:6px 8px;border:1px solid #2a2a30;border-radius:8px;background:#131316;color:#d4d4d8;font-size:12px;outline:none">
      <label>策略
        <select id="bt-strategy"><option value="">加载中…</option></select>
      </label>
    </div>
    <div class="bt-ctl" id="bt-parameters">加载研究参数…</div>
    <div id="bt-indicator-settings"></div>
    <p id="bt-position-note" class="studio-note"></p>
    <button class="v2-btn" id="bt-run" disabled>运行回测</button>
    <div id="bt-run-status" class="studio-note" role="status"></div>
    <div class="mini" id="bt-strategy-desc" style="color:#a1a1aa;margin-top:8px;line-height:1.8">加载策略目录…</div>
    <div class="mini" style="margin-top:8px">1 基点 = 0.01%。当前使用前复权价格和小数调整份额；结果用于研究。股票数上限按当前缓存选取，不代表全市场已完整下载。</div>
    <div id="bt-result"><div class="mini">设置研究区间、换股间隔和成本后运行；可改变滑点重复实验，并在历史记录中比较。</div></div>
  </div>

  <!-- 历史记录 -->
  <div class="v2-card anim-fade-in-up d1" style="margin-top:14px">
    <h2> 历史记录 <span class="tag" id="bt-count">…</span></h2>
    <div class="bt-filter" id="bt-filter"></div>
    <div id="bt-archive"><span class="mini" style="opacity:.6">加载中…</span></div>
  </div>
</div>

<script src="/v2/core/api.js"></script>
<script src="/v2/core/render.js"></script>
<script src="/v2/components/icons.js"></script>
<script src="/v2/components/search.js"></script>
<script src="/v2/components/sidebar.js"></script>
<script src="/v2/components/studio.js"></script>
<script src="/v2/components/indicator_editor.js"></script><script src="/v2/components/research_chart.js"></script><script src="/v2/components/trade_replay.js"></script><script src="/v2/components/rule_replay.js"></script><script src="/v2/components/backtest_report.js"></script>
<script>
(function () {
  LW.sidebar.render('sidebar', {active: 'backtest'});
  var R = LW.render;

  function verdictClass(v) {
    return v === '优秀' ? 'vtag-v5' : v === '良好' ? 'vtag-v4' : v === '观察' ? 'vtag-v3' : v === '勉强' ? 'vtag-v2' : 'vtag-v1';
  }
  function renderResult(d) { LW.backtestReport.render(document.getElementById('bt-result'), d); }

  /* ★2026-08-16 策略目录：动态加载（/api/live/backtest_strategies）+ 分类筛选 + 搜索 + 记忆 + 描述 */
  var STRATS = {};
  var PARAMS = {};
  var POOLS = [];
  var BTCONFIG,btIndicatorEditor,lastAppliedStrategy='';
  function applyPool() {
    var select=document.getElementById('bt-pool_id'), pool=POOLS.find(function(p){return select&&p.id===select.value;});
    var codes=document.getElementById('bt-codes'),hint=document.getElementById('bt-pool-note');
    if(codes)codes.readOnly=!!pool;
    if(!pool){if(hint)hint.textContent='未选择保存的股票池，使用填写的股票代码；留空则按缓存范围选股。';return;}
    codes.value=pool.codes.join(',');document.getElementById('bt-stocks').value=pool.count;
    var top=document.getElementById('bt-topn');top.value=Math.min(Number(top.value)||pool.count,pool.count);
    var start=document.getElementById('bt-start'),end=document.getElementById('bt-end');
    if(pool.signal_date&&start.value<=pool.signal_date){var d=new Date(pool.signal_date+'T00:00:00Z');d.setUTCDate(d.getUTCDate()+1);start.value=d.toISOString().slice(0,10);}
    if(end.value<start.value)end.value=start.value;
    if(hint)hint.textContent='本次只使用“'+pool.name+'”的'+pool.count+'只股票。'+(pool.signal_date?'选股日 '+pool.signal_date+'，回测必须从这一天之后开始。想做更早的历史检验，请先按当时日期重新选股。':'这是手动保存的固定名单，请自行核对名单当时是否已知。');
  }
  var defaultStrategy = '';
  var incoming = new URLSearchParams(window.location.search);
  function applyStrategyMeta() {
    var id = document.getElementById('bt-strategy').value;
    var s = STRATS[id] || {};
    var d = s.defaults || {};
    if(id!==lastAppliedStrategy)(BTCONFIG.strategy_default_keys||Object.keys(d)).forEach(function (key) {
      var input = document.getElementById('bt-' + key);
      if (input) input.value = d[key]==null?PARAMS[key].default:d[key];
    });
    if(btIndicatorEditor&&id!==lastAppliedStrategy)btIndicatorEditor.setFactors(s.factors||[],d.indicator_params||{});
    lastAppliedStrategy=id;
    applyPool();
    var runBtn = document.getElementById('bt-run');
    var desc = document.getElementById('bt-strategy-desc');
    if (desc) {
      desc.innerHTML =
        '<b style="color:var(--navy2)">' + R._f(s.name || id) + '</b> · <span style="color:' + catColor(s.category) + '">' + R._f(s.category || '') + '</span>' +
        (s.instant === false ? ' · <b style="color:var(--gold)">批处理（约 1-3 分钟，结果入归档）</b>' : '') +
        ' <span style="color:var(--muted)">· ' + R._f((s.desc || '')+' '+(s.data_note || '')) + '</span>';
    }
    if (runBtn) runBtn.disabled = !id || s.instant === false;
  }
  function renderStrategyOptions() {
    var cat = document.getElementById('bt-cat-filter').value;
    var kw = (document.getElementById('bt-search').value || '').trim();
    var saved = null;
    try { saved = localStorage.getItem('bt.strategy'); } catch (e) {}
    var ids = Object.keys(STRATS).filter(function (id) {
      var s = STRATS[id];
      if (cat && s.category !== cat) return false;
      if (kw && (s.name + ' ' + (s.desc || '') + ' ' + (s.factors || []).join(' ')).toLowerCase().indexOf(kw.toLowerCase()) < 0) return false;
      return true;
    });
    var sel = document.getElementById('bt-strategy'),previous=sel.value;
    sel.innerHTML = ids.map(function (id) {
      var s = STRATS[id];
      return '<option value="' + id + '">' + R._f(s.name) + '（' + R._f(s.category) + '）</option>';
    }).join('') || '<option value="">无匹配策略</option>';
    var requested = incoming.get('strategy');
    var target = ids.indexOf(previous)>=0?previous:ids.indexOf(requested) >= 0 ? requested : ids.indexOf(saved) >= 0 ? saved : ids.indexOf(defaultStrategy) >= 0 ? defaultStrategy : ids[0];
    if (target) sel.value = target;
    applyStrategyMeta();
  }
  function loadStrategies() {
    return LW.api.get('/api/research/config').then(function (d) {
      STRATS = (d && d.strategies) || {};
      BTCONFIG=d;
      btIndicatorEditor=LW.indicatorEditor.mount('bt-indicator-settings',d,[],{});
      document.getElementById('bt-position-note').textContent=d.position_note;
      defaultStrategy = d.default_strategy || '';
      var catFilter = document.getElementById('bt-cat-filter');
      catFilter.textContent = '';
      [''].concat(Array.from(new Set(Object.keys(STRATS).map(function (id) { return STRATS[id].category; })))).forEach(function (cat) {
        var option = document.createElement('option'); option.value = cat; option.textContent = cat || '全部'; catFilter.appendChild(option);
      });
      PARAMS = d.parameters || {};
      POOLS = d.stock_pools || [];
      var form = document.getElementById('bt-parameters'); form.textContent = '';
      var fieldHosts = {};
      (d.parameter_groups || []).forEach(function(group){
        var section=document.createElement('fieldset'),legend=document.createElement('legend');
        section.className='bt-param-group';legend.textContent=group.label;section.appendChild(legend);form.appendChild(section);
        (group.fields||[]).forEach(function(key){fieldHosts[key]=section;});
      });
      Object.keys(PARAMS).forEach(function (key) {
        if(PARAMS[key].hidden)return;
        var field = PARAMS[key], label = document.createElement('label'), input = document.createElement(field.type==='select'?'select':'input');
         label.textContent = field.label; input.id = 'bt-' + key; if(field.type==='select'){Object.keys(field.options||{}).forEach(function(v){var o=document.createElement('option');o.value=v;o.textContent=typeof field.options[v]==='string'?field.options[v]:field.options[v].label||v;input.appendChild(o);});}else input.type = field.type;
        input.value = field.default == null ? '' : field.default;
         ['min', 'max', 'step'].forEach(function (prop) { if (field[prop] != null) input[prop] = field[prop]; }); input.required=field.required!==false&&field.default==null?true:!!field.required; if(input.type==='number')input.inputMode='decimal'; input.dataset.key=key;
        input.style.width = field.type === 'select' ? '260px' : field.type === 'text' ? '230px' : field.type === 'date' ? '140px' : '100px';
        label.appendChild(input); (fieldHosts[key] || form).appendChild(label);
      });
      renderStrategyOptions();
      (function(){
        var mode=document.getElementById('bt-trade_mode');if(!mode)return;
        var group=(d.parameter_groups||[]).find(function(g){return (g.fields||[]).includes('trade_mode');});
        function sync(){var event=mode.value==='event',fixed=document.getElementById('bt-rebalance_days');if(fixed)fixed.closest('label').hidden=event;
          ((group||{}).fields||[]).filter(function(k){return k!=='trade_mode';}).forEach(function(k){var el=document.getElementById('bt-'+k);if(el)el.closest('label').hidden=!event;});}
        mode.addEventListener('change',sync);sync();
        document.getElementById('bt-strategy').addEventListener('change',function(){setTimeout(sync,0);});
      }());
      // ── 周期快捷按钮（填充 bt-start / bt-end）────────────────────────────
      (function(){
        var startEl = document.getElementById('bt-start'), endEl = document.getElementById('bt-end');
        if (!startEl || !endEl) return;
        var wrap = document.createElement('div');
        wrap.className = 'bt-period-btns';
        wrap.setAttribute('aria-label', '快速设置回测区间');
        var periods = [
          {label:'1M', months:1}, {label:'3M', months:3}, {label:'6M', months:6},
          {label:'1Y', months:12}, {label:'3Y', months:36}, {label:'5Y', months:60},
          {label:'ALL', months:0}
        ];
        var activeBtn = null;
        periods.forEach(function(p) {
          var btn = document.createElement('button');
          btn.type = 'button'; btn.textContent = p.label;
          btn.title = p.months ? '最近' + p.label : '全部可用数据';
          btn.onclick = function() {
            var end = new Date(); end.setHours(0,0,0,0);
            endEl.value = end.toISOString().slice(0,10);
            if (p.months) {
              var start = new Date(end); start.setMonth(start.getMonth() - p.months);
              startEl.value = start.toISOString().slice(0,10);
            } else {
              startEl.value = PARAMS.start ? PARAMS.start.default : '2015-01-01';
            }
            if (activeBtn) activeBtn.classList.remove('active');
            btn.classList.add('active'); activeBtn = btn;
            applyPool();
          };
          wrap.appendChild(btn);
        });
        startEl.parentNode.insertAdjacentElement('beforebegin', wrap);
        // 手动改日期时取消高亮
        [startEl, endEl].forEach(function(el) {
          el.addEventListener('change', function() {
            if (activeBtn) { activeBtn.classList.remove('active'); activeBtn = null; }
          });
        });
      })();
      Object.keys(PARAMS).forEach(function (key) {
        if(PARAMS[key].hidden)return;
        if (incoming.has(key)) document.getElementById('bt-' + key).value = incoming.get(key);
      });
      if(incoming.has('indicator_params')){try{btIndicatorEditor.setFactors((STRATS[document.getElementById('bt-strategy').value]||{}).factors||[],JSON.parse(incoming.get('indicator_params')));}catch(e){document.getElementById('bt-run-status').textContent='传入的指标参数无法读取，请重新设置。';}}
      var hint=document.createElement('p');hint.id='bt-pool-note';hint.className='studio-note';form.appendChild(hint);
      document.getElementById('bt-pool_id').onchange=applyPool;var planSelect=document.getElementById('bt-signal_plan_id');function applyPlan(){var plan=(BTCONFIG.signal_plans||[]).find(function(p){return p.id===planSelect.value;});if(plan)document.getElementById('bt-pool_id').value=plan.pool_id;applyPool();if(plan)hint.textContent+=' 仅在入场条件满足时新建仓，持仓等待退出条件或风险退出；普通换股日不强制卖出。';}planSelect.onchange=applyPlan;applyPlan();
    }).catch(function (e) {
      document.getElementById('bt-parameters').textContent = '研究配置读取失败：' + e;
      document.getElementById('bt-run').disabled = true;
    });
  }
  document.getElementById('bt-cat-filter').addEventListener('change', renderStrategyOptions);
  document.getElementById('bt-search').addEventListener('input', renderStrategyOptions);
  document.getElementById('bt-strategy').addEventListener('change', function () {
    try { localStorage.setItem('bt.strategy', this.value); } catch (e) {}
    applyStrategyMeta();
  });
  loadStrategies().then(function(){var resumed=LW.studio.resume('bt-run-status',renderResult);if(resumed){document.getElementById('bt-run').disabled=true;resumed.catch(function(){}).finally(function(){document.getElementById('bt-run').disabled=false;});}});

  document.getElementById('bt-run').onclick = function () {
    var invalid=Array.from(document.querySelectorAll('#bt-parameters input,#bt-parameters select')).find(function(input){return !input.disabled&&!input.reportValidity();}); if(invalid){invalid.focus();return;}
    var values = {strategy: document.getElementById('bt-strategy').value};
    Object.keys(PARAMS).forEach(function (key) {
      if(PARAMS[key].hidden)return;
       var input=document.getElementById('bt-' + key); values[key] = input.type==='number'?(input.value===''?null:Number(input.value)):input.value;
    });
    values.indicator_params=btIndicatorEditor.get();
    var btn = document.getElementById('bt-run'); btn.disabled = true;
    document.getElementById('bt-result').textContent = '回测运行中，请勿重复点击…';
    LW.studio.job('backtest',values,'bt-run-status').then(function (d) {
      if (!d.ok) throw new Error(d.error || '回测失败');
      renderResult(d);
      LW.api.clear();
      loadArchive();   // 运行后刷新历史记录
    }).catch(function (e) { document.getElementById('bt-result').textContent = '失败：' + e.message; })
    .finally(function () { btn.disabled = false; });
  };

  /* ---------- 历史记录（只看最新 + 类型 + 有效/无效 + 关键词） ---------- */
  var latest = [], history = [], afLatest = false, afCat = '全部', afVerd = '全部', afKw = '';
  function catColor(c) { return c === '复刻' ? '#8b5cf6' : c === '因子' ? '#2d9cdb' : c === '策略' ? '#27ae60' : '#a1a1aa'; }
  function cardHtml(a) {
    var ann = a.annual_return != null ? pct(a.annual_return) : '—';
    var dd = a.max_drawdown != null ? pct(a.max_drawdown) : '—';
    var shp = a.sharpe != null ? a.sharpe.toFixed(2) : '—';
    var annC = a.annual_return >= 0 ? '#eb5757' : '#27ae60';
    var facs = (a.factors || []).slice(0, 5).map(function (f) { return '<span class="tag-st tag-dim" style="margin-left:4px">' + R._f(f) + '</span>'; }).join('');
    function fname(p) { return String(p || '').split(/[\\/]/).pop(); }
    var btn = a.has_html
      ? '<a class="v2-btn" href="/dl/backtest_archive/' + encodeURIComponent(fname(a.html)) + '" target="_blank">打开报告</a>'
      : '<a class="v2-btn" style="background:#16161a;color:var(--navy)" href="/dl/backtest_archive/' + encodeURIComponent(fname(a.json)) + '" target="_blank">查看JSON</a>';
    var archiveId = fname(a.json).replace(/\.json$/, '');
    if (/^research_[a-z0-9_]+_[0-9a-f]{32}$/.test(archiveId)) {
      btn = '<a class="v2-btn" href="/backtests?run=' + encodeURIComponent(archiveId) + '">查看可视化报告</a>';
    }
    var latestBadge = a.is_latest ? '<span class="vtag" style="background:rgba(94,106,210,.14);color:#8b5cf6">最新</span>' : '';
    return '<div class="v2-card" style="margin-top:0;padding:14px 16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap">' +
        '<span><b>' + R._f(a.title || a.name || '回测') + '</b>' + latestBadge +
          '<span class="vtag" style="background:' + catColor(a.category) + '1a;color:' + catColor(a.category) + '">' + a.category + '</span>' +
          '<span class="vtag ' + verdictClass(a.verdict) + '">' + a.verdict + '</span>' +
        '</span>' +
        '<span class="mini" style="opacity:.6">' + R._f(a.generated_at || '') + '</span></div>' +
      '<div class="mini" style="margin:6px 0 4px;color:#a1a1aa">' + facs + '</div>' +
      '<div class="mini" style="margin:6px 0;color:#a1a1aa">年化 <b style="color:' + annC + '">' + ann + '</b> · 回撤 <b style="color:#27ae60">' + dd + '</b> · 夏普 <b>' + shp + '</b></div>' + btn + '</div>';
  }
  function renderArchive() {
    var src = afLatest ? latest : history;
    var kw = afKw.trim().toLowerCase();
    var list = src.filter(function (a) {
      var catOk = afCat === '全部' || a.category === afCat;
      var verdOk = afVerd === '全部' || a.verdict === afVerd;
      var kwOk = !kw || (a.name || '').toLowerCase().indexOf(kw) >= 0 ||
        (a.title || '').toLowerCase().indexOf(kw) >= 0 || (a.factors || []).join(',').toLowerCase().indexOf(kw) >= 0;
      return catOk && verdOk && kwOk;
    });
    var host = document.getElementById('bt-archive');
    if (!list.length) { host.innerHTML = '<div class="mini" style="opacity:.6;padding:10px 0">无匹配记录。</div>'; return; }
    host.innerHTML = '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px">' +
      list.slice(0, 100).map(cardHtml).join('') + '</div>';
  }
  function loadArchive() {
    LW.api.get('/api/live/backtest_archive').then(function (d) {
      latest = (d && d.latest) || [];
      history = (d && d.history) || [];
      var all = latest.concat(history);
      var cats = ['全部'].concat(Array.from(new Set(all.map(function (a) { return a.category; }))));
      var verds = ['全部'].concat(Array.from(new Set(all.map(function (a) { return a.verdict; }))));
      document.getElementById('bt-count').textContent = '最新 ' + latest.length + ' · 历史 ' + history.length;
      document.getElementById('bt-filter').innerHTML =
        '<label class="mini" style="display:flex;align-items:center;gap:4px;cursor:pointer">' +
          '<input type="checkbox" id="bt-latest"> 只看最新</label>' +
        '<span class="mini">类型</span>' +
        '<select id="bt-cat" class="lf-btn" style="cursor:pointer">' + cats.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
        '<span class="mini">有效</span>' +
        '<select id="bt-verd" class="lf-btn" style="cursor:pointer">' + verds.map(function (c) { return '<option>' + c + '</option>'; }).join('') + '</select>' +
        '<input id="bt-kw" placeholder="搜索名称/标题/因子" style="flex:1;min-width:160px;padding:6px 10px;border:1px solid #2a2a30;border-radius:8px;font-size:12px;outline:none">';
      document.getElementById('bt-latest').onchange = function () { afLatest = this.checked; renderArchive(); };
      document.getElementById('bt-cat').onchange = function () { afCat = this.value; renderArchive(); };
      document.getElementById('bt-verd').onchange = function () { afVerd = this.value; renderArchive(); };
      document.getElementById('bt-kw').oninput = function () { afKw = this.value; renderArchive(); };
      renderArchive();
    }).catch(function () { document.getElementById('bt-archive').innerHTML = '<div class="mini" style="opacity:.6">历史加载失败</div>'; });
  }
  loadArchive();
})();
</script>

</body>
</html>

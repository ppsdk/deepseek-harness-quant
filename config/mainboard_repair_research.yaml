# 主板低风险修复策略研究 v2。所有会变化的策略、阈值和标的选择均在此配置。
research_version: engine_v2_interval_cap_stability
as_of: "2026-10-27"
output_dir: output/strategy_research/mainboard_repair_v2
snapshot_dir: output/strategy_research/mainboard_low_turnover
data_start: "2017-11-01"
data_end: "2026-10-23"
resources: {read_chunk_stocks: 100}
benchmark:
  code: 000300.SH
  label: 沪深300价格指数
  description: >-
    基准为沪深300价格指数；它是价格指数，未计分红，不能把结果宣称成严格的全收益净超额。
universe:
  code_pattern: '^(60[0135]\d{3}\.SH|00[0-3]\d{3}\.SZ)$'
  min_history_days: 252
  liquidity_window: 20
  min_average_amount: 20000000
  exclude_st: true
periods:
  observation: {start: "2026-01-01", end: "2026-10-23"}
  full: {start: "2019-01-01", end: "2026-10-23"}
rounds:
  - id: round_1
    discovery: {start: "2019-01-01", end: "2022-12-31"}
    validation: {start: "2023-01-01", end: "2024-12-31"}
  - id: round_2
    discovery: {start: "2023-01-01", end: "2024-12-31"}
    validation: {start: "2025-01-01", end: "2025-12-31"}
targets:
  annual_return: 0.20
  excess_annual_return: 0.20
  accepted_return_measures: [absolute, excess_pp]
  max_drawdown: -0.10
  max_holdings: 5
  max_traded_codes_per_day: 5
execution:
  initial_capital: 1000000
  topn: 5
  commission_bps: 3
  min_commission: 5
  stamp_tax_bps: 10
  slippage_bps: 10
  allocation: equal
  max_position_pct: 20
  rebalance_threshold_pct: 3
  trade_mode: fixed
  min_trade_interval_days: 20
  max_traded_codes_per_day: 5
  entry_ma_fast: 20
  entry_ma_slow: 60
  exit_ma_period: 20
  ma_confirm_days: 2
  target_exposure_pct: 100
  timing_index: 000300.SH
  timing_rule: index_strong_risk_ma
  timing_execution: daily_exit
  stop_loss_pct: 0
  take_profit_pct: 0
  trailing_stop_pct: 0
  max_holding_days: 0
  risk_cooldown_days: 5
risk_pools:
  balanced:
    description: 低波、低跳空、低振幅、低下行波动和低极端日收益的温和风险池。
    limits:
      - {factor: lowvol_60, max_percentile: 0.65, sign: -1}
      - {factor: research_gap_risk, max_percentile: 0.75, sign: -1}
      - {factor: intraday_range_20, max_percentile: 0.65, sign: -1}
      - {factor: downside_realized_vol_20, max_percentile: 0.75, sign: -1}
      - {factor: max_daily_return_20, max_percentile: 0.80, sign: -1}
    trend: {period: 60, min_return: -0.15}
  liquid_lowrisk:
    description: 同时压低换手、波动、跳空、振幅和极端日收益，优先选择可低频交易的安心股票。
    limits:
      - {factor: turn_20d, max_percentile: 0.55, sign: -1}
      - {factor: lowvol_60, max_percentile: 0.55, sign: -1}
      - {factor: research_gap_risk, max_percentile: 0.70, sign: -1}
      - {factor: intraday_range_20, max_percentile: 0.60, sign: -1}
      - {factor: max_daily_return_20, max_percentile: 0.75, sign: -1}
    trend: {period: 60, min_return: -0.10}
  strict:
    description: 更窄的低风险池，用于检验进一步压低风险是否改善风险调整收益。
    limits:
      - {factor: lowvol_60, max_percentile: 0.45, sign: -1}
      - {factor: research_gap_risk, max_percentile: 0.65, sign: -1}
      - {factor: intraday_range_20, max_percentile: 0.50, sign: -1}
      - {factor: downside_realized_vol_20, max_percentile: 0.60, sign: -1}
      - {factor: max_daily_return_20, max_percentile: 0.75, sign: -1}
    trend: {period: 60, min_return: -0.12}
entry_rules:
  none:
    description: 风险池和因子排名直接建仓，不额外要求当日均线状态。
  ma20_repair:
    description: 收盘回到 MA20 上方不到 5%，且 MA5 不低于 MA20。
    fast: 5
    slow: 20
    min_price_vs_slow: 0.0
    max_price_vs_slow: 0.05
    require_fast_above_slow: true
    confirm_days: 1
  ma60_zone:
    description: 收盘位于 MA60 上方 0% 至 8%，且 MA20 不低于 MA60 的温和修复区间。
    fast: 20
    slow: 60
    min_price_vs_slow: 0.0
    max_price_vs_slow: 0.08
    require_fast_above_slow: true
    confirm_days: 1
  ma60_pullback:
    description: MA60 上行时缩量回踩到其附近，收盘未跌破 MA60 下沿 1%，且 MA20 不低于 MA60。
    fast: 20
    slow: 60
    min_price_vs_slow: -0.01
    max_price_vs_slow: 0.06
    require_fast_above_slow: true
    slow_rising_days: 10
    min_slow_slope: 0.0
    volume_shrink_window: 20
    max_volume_ratio: 0.85
    confirm_days: 1
candidates:
  low_turnover_defensive:
    label: 低换手低波＋价格压力弱
    pool: liquid_lowrisk
    entry_rule: none
    factors:
      - {name: turn_20d, sign: -1, weight: 1}
      - {name: lowvol_60, sign: -1, weight: 1}
      - {name: price_pressure_20, sign: -1, weight: 1}
  ma20_repair:
    label: 温和风险池＋MA20修复
    pool: balanced
    entry_rule: ma20_repair
    factors:
      - {name: price_pressure_20, sign: -1, weight: 1}
      - {name: downside_realized_vol_20, sign: -1, weight: 1}
      - {name: turn_20d, sign: -1, weight: 1}
  ma60_zone_support:
    label: 低换手低波＋MA60区间企稳
    pool: liquid_lowrisk
    entry_rule: ma60_zone
    factors:
      - {name: lowvol_60, sign: -1, weight: 1}
      - {name: intraday_range_20, sign: -1, weight: 1}
      - {name: turn_20d, sign: -1, weight: 1}
  ma60_quiet_pullback:
    label: 低风险池＋MA60缩量回踩
    pool: liquid_lowrisk
    entry_rule: ma60_pullback
    factors:
      - {name: downside_realized_vol_20, sign: -1, weight: 1}
      - {name: research_gap_risk, sign: -1, weight: 1}
      - {name: turn_20d, sign: -1, weight: 1}
  seller_exhaustion:
    label: 温和风险池＋量价压力衰竭
    pool: balanced
    entry_rule: none
    factors:
      - {name: price_pressure_20, sign: -1, weight: 1}
      - {name: obv_momentum_20, sign: -1, weight: 1}
      - {name: o2c_20, sign: -1, weight: 1}
  quiet_uptrend:
    label: MA60区间＋平滑趋势与低波
    pool: balanced
    entry_rule: ma60_zone
    factors:
      - {name: research_trend_efficiency, sign: 1, weight: 1}
      - {name: lowvol_60, sign: -1, weight: 1}
      - {name: downside_realized_vol_20, sign: -1, weight: 1}
stock_selection_policies:
  stable_diverse:
    label: 持仓缓冲＋换股门槛＋相关性分散
    retain_rank: 15
    replacement_score_margin: 0.08
    correlation_limit: 0.82
    correlation_window: 120
    correlation_min_observations: 60
    max_candidates: 100
variants:
  - id: monthly_cap5
    label: 月频、每日最多涉及5只
    rebalance_days: 20
    min_trade_interval_days: 20
    max_traded_codes_per_day: 5
    target_exposure_pct: 100
    selection_policy: stable_diverse
  - id: monthly_cap2
    label: 月频、每日最多涉及2只
    rebalance_days: 20
    min_trade_interval_days: 20
    max_traded_codes_per_day: 2
    target_exposure_pct: 100
    selection_policy: stable_diverse
  - id: weekly_event_cap2
    label: 均线事件、至少间隔5日、每日最多涉及2只
    trade_mode: event
    rebalance_days: 20
    min_trade_interval_days: 5
    max_traded_codes_per_day: 2
    target_exposure_pct: 100
    selection_policy: stable_diverse
  - id: monthly_event_cap2
    label: 均线事件、至少间隔20日、每日最多涉及2只
    trade_mode: event
    rebalance_days: 20
    min_trade_interval_days: 20
    max_traded_codes_per_day: 2
    target_exposure_pct: 100
    selection_policy: stable_diverse
  - id: weekly_event_cap3_defensive
    label: 均线事件、至少间隔5日、每日最多涉及3只、六成仓
    trade_mode: event
    rebalance_days: 20
    min_trade_interval_days: 5
    max_traded_codes_per_day: 3
    target_exposure_pct: 60
    selection_policy: stable_diverse
ic:
  horizons: [5, 20]
  min_stocks: 50
  sample_every_days: 5
selection:
  finalists: 3
  max_search_combinations_per_round: 30
stress: {slippage_bps: 30, commission_bps: 5}
validation_is_fresh_blind: false
